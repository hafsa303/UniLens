<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_12 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_12" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_12');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const scene = new THREE.Scene();
const container = document.querySelector('threejs-scene') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x6366f1, 2);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// "Intelligence Core" - Abstract Geometric Data Representation
const group = new THREE.Group();
scene.add(group);

const coreGeometry = new THREE.IcosahedronGeometry(1, 1);
const coreMaterial = new THREE.MeshPhongMaterial({
    color: 0x6366f1,
    wireframe: true,
    transparent: true,
    opacity: 0.8,
    shininess: 100
});
const core = new THREE.Mesh(coreGeometry, coreMaterial);
group.add(core);

// Inner Solid Core
const innerCoreGeom = new THREE.SphereGeometry(0.5, 32, 32);
const innerCoreMat = new THREE.MeshStandardMaterial({
    color: 0x818cf8,
    emissive: 0x4f46e5,
    emissiveIntensity: 0.5,
    metalness: 0.8,
    roughness: 0.2
});
const innerCore = new THREE.Mesh(innerCoreGeom, innerCoreMat);
group.add(innerCore);

// Floating "Data Points" (Particles)
const particlesCount = 100;
const positions = new Float32Array(particlesCount * 3);
for(let i=0; i<particlesCount * 3; i++) {
    positions[i] = (Math.random() - 0.5) * 6;
}
const particlesGeom = new THREE.BufferGeometry();
particlesGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particlesMat = new THREE.PointsMaterial({
    color: 0x6366f1,
    size: 0.05,
    transparent: true,
    opacity: 0.6
});
const particles = new THREE.Points(particlesGeom, particlesMat);
group.add(particles);

// Mouse Interaction
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) - 0.5;
    mouseY = (e.clientY / window.innerHeight) - 0.5;
});

// Resize Handler
window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

function animate(t) {
    requestAnimationFrame(animate);
    
    const time = t * 0.001;
    
    // Slow rotations
    core.rotation.y += 0.005;
    core.rotation.x += 0.003;
    innerCore.rotation.z += 0.01;
    
    // Pulse effect
    const pulse = 1 + Math.sin(time * 2) * 0.05;
    core.scale.set(pulse, pulse, pulse);
    
    // Mouse tracking lag
    group.rotation.y += (mouseX * 0.5 - group.rotation.y) * 0.05;
    group.rotation.x += (mouseY * 0.5 - group.rotation.x) * 0.05;
    
    // Drift particles
    particles.rotation.y += 0.001;
    
    renderer.render(scene, camera);
}
animate(0);
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_12 -->
</body>
</html>
