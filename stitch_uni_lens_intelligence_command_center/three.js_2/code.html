<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_15 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_15" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_15');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  camera.position.z = 4;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  const pointLight = new THREE.PointLight(0x6366f1, 2, 10);
  pointLight.position.set(2, 2, 2);
  scene.add(pointLight);

  const topLight = new THREE.PointLight(0x818cf8, 1, 10);
  topLight.position.set(-2, 3, 1);
  scene.add(topLight);

  // Intelligence Core - Geometric Representation
  const coreGroup = new THREE.Group();
  scene.add(coreGroup);

  // Wireframe Polyhedron
  const geo1 = new THREE.IcosahedronGeometry(1.2, 1);
  const mat1 = new THREE.MeshPhongMaterial({
    color: 0x6366f1,
    wireframe: true,
    transparent: true,
    opacity: 0.4,
    shininess: 100
  });
  const mesh1 = new THREE.Mesh(geo1, mat1);
  coreGroup.add(mesh1);

  // Inner Glowing Sphere
  const geo2 = new THREE.SphereGeometry(0.6, 32, 32);
  const mat2 = new THREE.MeshStandardMaterial({
    color: 0x818cf8,
    emissive: 0x4f46e5,
    emissiveIntensity: 0.8,
    metalness: 0.9,
    roughness: 0.1
  });
  const mesh2 = new THREE.Mesh(geo2, mat2);
  coreGroup.add(mesh2);

  // Orbiting "Data Points"
  const pointsCount = 150;
  const positions = new Float32Array(pointsCount * 3);
  for(let i=0; i < pointsCount * 3; i++) {
    positions[i] = (Math.random() - 0.5) * 5;
  }
  const pointsGeo = new THREE.BufferGeometry();
  pointsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const pointsMat = new THREE.PointsMaterial({
    color: 0x6366f1,
    size: 0.03,
    transparent: true,
    opacity: 0.6
  });
  const dataPoints = new THREE.Points(pointsGeo, pointsMat);
  coreGroup.add(dataPoints);

  // Interaction
  let targetRotationX = 0;
  let targetRotationY = 0;
  window.addEventListener('mousemove', (e) => {
    targetRotationY = (e.clientX / window.innerWidth - 0.5) * 0.5;
    targetRotationX = (e.clientY / window.innerHeight - 0.5) * 0.5;
  });

  // Resize
  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  function animate(t) {
    requestAnimationFrame(animate);
    const time = t * 0.001;

    coreGroup.rotation.y += (targetRotationY - coreGroup.rotation.y) * 0.05;
    coreGroup.rotation.x += (targetRotationX - coreGroup.rotation.x) * 0.05;

    mesh1.rotation.y += 0.005;
    mesh1.rotation.z += 0.003;
    
    const pulse = 1 + Math.sin(time * 1.5) * 0.08;
    mesh2.scale.set(pulse, pulse, pulse);
    
    dataPoints.rotation.y += 0.002;
    dataPoints.rotation.x += 0.001;

    renderer.render(scene, camera);
  }
  animate(0);
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_15 -->
</body>
</html>
